<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دليل أرقام الهواتف</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #17346f;
      --primary-light: #2f559d;
      --background: #f4f7fc;
      --border: #e2e8f2;
      --text: #17346f;
      --muted: #78869b;
      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Cairo", Arial, sans-serif;
    }

    .header {
      min-height: 390px;
      padding: 35px 20px 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #102451, #2e4f94);
    }

    .header-content {
      width: 100%;
    }

    .logo-wrapper {
      width: 145px;
      height: 145px;
      margin: 0 auto 20px;
      padding: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .official-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(32px, 6vw, 60px);
      font-weight: 800;
    }

    .subtitle {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(15px, 2.5vw, 24px);
    }

    .container {
      width: min(1180px, calc(100% - 30px));
      margin: -45px auto 35px;
      position: relative;
      z-index: 2;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 30px rgba(20, 42, 85, 0.16);
    }

    .search-box {
      min-height: 62px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border-radius: 13px;
      background: #fff;
    }

    #searchInput {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      text-align: right;
      font-family: inherit;
      font-size: 18px;
    }

    #searchButton {
      min-height: 62px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #17346f, #31569d);
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
    }

    #searchButton:active {
      transform: scale(0.98);
    }

    .hint {
      margin: 14px 0 28px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .section-title {
      margin: 0 0 15px;
      font-size: 30px;
      font-weight: 800;
    }

    .results {
      min-height: 180px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(28, 50, 93, 0.07);
    }

    .contacts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }

    .contact-card {
      position: relative;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(145deg, #fff, #f9fbff);
      box-shadow: 0 4px 13px rgba(25, 48, 92, 0.05);
    }

    .contact-card::before {
      content: "";
      position: absolute;
      right: 0;
      top: 16px;
      bottom: 16px;
      width: 4px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(#24488d, #70a1df);
    }

    .contact-name {
      padding-right: 7px;
      margin-bottom: 8px;
      color: #173a7b;
      font-size: 20px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .job-title {
      padding-right: 7px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .phone-row,
    .data-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid #edf0f5;
      font-size: 14px;
    }

    .phone-label,
    .data-label {
      color: var(--muted);
      white-space: nowrap;
    }

    .phone-number,
    .data-value {
      color: #1c3978;
      font-weight: 700;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .phone-number {
      direction: ltr;
    }

    .phone-number a {
      color: inherit;
      text-decoration: none;
    }

    .empty {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      line-height: 2;
    }

    .loading {
      color: var(--primary);
    }

    .error {
      color: var(--danger);
    }

    .footer {
      padding: 0 20px 25px;
      color: #8994a8;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .header {
        min-height: 350px;
        padding: 28px 15px 55px;
      }

      .logo-wrapper {
        width: 115px;
        height: 115px;
      }

      .container {
        width: calc(100% - 22px);
        margin-top: -32px;
      }

      .search-area {
        display: flex;
        flex-direction: column;
      }

      #searchButton,
      .search-box {
        min-height: 58px;
      }

      .contacts-list {
        grid-template-columns: 1fr;
      }

      .results {
        padding: 12px;
      }

      .phone-row,
      .data-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-content">

      <div class="logo-wrapper">
        <img
          src="logo.PNG"
          alt="شعار الإدارة العامة للجنسية ووثائق السفر"
          class="official-logo">
      </div>

      <h1>دليل أرقام الهواتف</h1>

      <div class="subtitle">
        الإدارة العامة للجنسية ووثائق السفر الكويتية
      </div>

    </div>
  </header>


  <main class="container">

    <div class="search-area">

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="إبحث بالاسم فقط..."
          aria-label="البحث بالاسم">
      </div>

      <button id="searchButton" type="button">
        بحث 🔍
      </button>

    </div>

    <div class="hint">
      اكتب الاسم ثم اضغط بحث لعرض التفاصيل
    </div>

    <h2 class="section-title">
      قائمة الأسماء
    </h2>

    <section class="results">
      <div id="contactsList" class="contacts-list"></div>

      <div id="emptyMessage" class="empty">
        جاري تحميل البيانات...
      </div>
    </section>

  </main>


  <footer class="footer">
    دليل أرقام الهواتف - الإدارة العامة للجنسية ووثائق السفر الكويتية
  </footer>


  <script>
    const SUPABASE_URL =
      "https://hxdpfrnxawhyanjwvlmv.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_TLic-BebUrdemyOnDcKnnQ_MnlLJjgH";

    const TABLE_NAME = "employees";


    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const contactsList = document.getElementById("contactsList");
    const emptyMessage = document.getElementById("emptyMessage");

    let allContacts = [];


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    function safe(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value).trim();
    }


    function escapeHtml(value) {
      return safe(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function getColumnByWords(contact, words) {
      const entry = Object.entries(contact).find(([key, value]) => {
        const columnName = safe(key).toLowerCase();

        return words.some(word =>
          columnName.includes(word.toLowerCase())
        ) && safe(value) !== "";
      });

      return entry ? entry[1] : "";
    }


    function getName(contact) {
      return (
        contact["الاسم"] ||
        contact["اسم الموظف"] ||
        contact["اسم الموظف الكامل"] ||
        contact["الاسم الكامل"] ||
        getColumnByWords(contact, ["اسم", "name"]) ||
        ""
      );
    }


    function getJobTitle(contact) {
      return (
        contact["المسمى الوظيفي"] ||
        contact["المسمى الوظيفي"] ||
        contact["الوظيفة"] ||
        contact["الوظيفي"] ||
        getColumnByWords(contact, ["مسمى", "وظيف", "job", "title"]) ||
        ""
      );
    }


    function isPhoneColumn(columnName) {
      const name = safe(columnName).toLowerCase();

      return (
        name.includes("رقم") ||
        name.includes("هاتف") ||
        name.includes("داخلي") ||
        name.includes("مباشر") ||
        name.includes("phone") ||
        name.includes("tel") ||
        name.includes("mobile")
      );
    }


    function normalizePhone(value) {
      return safe(value).replace(/[^\d+]/g, "");
    }


    function createDataRows(contact) {
      const nameKey = Object.keys(contact).find(key =>
        safe(key).includes("اسم") ||
        safe(key).toLowerCase().includes("name")
      );

      const jobKey = Object.keys(contact).find(key =>
        safe(key).includes("وظيف") ||
        safe(key).includes("مسمى") ||
        safe(key).toLowerCase().includes("job") ||
        safe(key).toLowerCase().includes("title")
      );

      const rows = [];

      Object.entries(contact).forEach(([key, value]) => {
        if (!safe(value)) {
          return;
        }

        if (key === nameKey || key === jobKey) {
          return;
        }

        if (key === "id") {
          return;
        }

        const valueText = escapeHtml(value);

        if (isPhoneColumn(key)) {
          const phone = normalizePhone(value);

          rows.push(`
            <div class="phone-row">
              <span class="phone-label">
                ${escapeHtml(key)}
              </span>

              <span class="phone-number">
                <a href="tel:${escapeHtml(phone)}">
                  ${valueText}
                </a>
              </span>
            </div>
          `);
        } else {
          rows.push(`
            <div class="data-row">
              <span class="data-label">
                ${escapeHtml(key)}
              </span>

              <span class="data-value">
                ${valueText}
              </span>
            </div>
          `);
        }
      });

      return rows.join("");
    }


    function showMessage(message, className = "") {
      contactsList.innerHTML = "";
      emptyMessage.className = `empty ${className}`;
      emptyMessage.innerHTML = message;
      emptyMessage.style.display = "flex";
    }


    function displayContacts(contacts) {
      contactsList.innerHTML = "";

      if (!contacts || contacts.length === 0) {
        emptyMessage.className = "empty";
        emptyMessage.textContent = "لا توجد نتائج مطابقة";
        emptyMessage.style.display = "flex";
        return;
      }

      emptyMessage.style.display = "none";

      contacts.forEach(contact => {
        const card = document.createElement("article");
        card.className = "contact-card";

        const name = getName(contact);
        const jobTitle = getJobTitle(contact);

        card.innerHTML = `
          <div class="contact-name">
            ${escapeHtml(name || "بدون اسم")}
          </div>

          ${
            jobTitle
              ? `
                <div class="job-title">
                  ${escapeHtml(jobTitle)}
                </div>
              `
              : ""
          }

          ${createDataRows(contact)}
        `;

        contactsList.appendChild(card);
      });
    }


    async function loadContacts() {
      showMessage("جاري تحميل البيانات...", "loading");

      try {
        /*
          مهم:
          لا نستخدم order("الاسم") لأن العمود الحقيقي
          ليس اسمه "الاسم".
        */
        const {
          data,
          error
        } = await supabaseClient
          .from(TABLE_NAME)
          .select("*");

        if (error) {
          throw error;
        }

        allContacts = Array.isArray(data) ? data : [];

        console.log(
          "أسماء الأعمدة الفعلية:",
          allContacts.length > 0
            ? Object.keys(allContacts[0])
            : "لا توجد بيانات"
        );

        console.log("البيانات القادمة من Supabase:", allContacts);

        if (allContacts.length === 0) {
          showMessage("لا توجد بيانات حالياً");
        } else {
          displayContacts(allContacts);
        }

      } catch (error) {
        console.error("Supabase error:", error);

        showMessage(
          "تعذر تحميل البيانات.<br>" +
          "تأكد من صلاحيات قراءة جدول employees.",
          "error"
        );
      }
    }


    function searchContacts() {
      const searchText =
        searchInput.value.trim().toLowerCase();

      if (!searchText) {
        displayContacts(allContacts);
        return;
      }

      const filteredContacts = allContacts.filter(contact => {
        const name = safe(getName(contact)).toLowerCase();

        return name.includes(searchText);
      });

      displayContacts(filteredContacts);
    }


    searchButton.addEventListener("click", searchContacts);

    searchInput.addEventListener("input", searchContacts);

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchContacts();
      }
    });


    loadContacts();
  </script>

</body>

</html>
