<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <!-- مهم جداً لعرض الموقع بشكل صحيح على الآيفون -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#192d61">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>دليل أرقام الهواتف</title>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #192d61;
      --primary-light: #294585;
      --text: #17346f;
      --muted: #77859a;
      --background: #f4f6fb;
      --border: #e4e8f0;
      --success: #168552;
      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: "Cairo", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .header {
      min-height: 500px;
      padding: max(35px, env(safe-area-inset-top)) 20px 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #192d61, #233d79);
    }

    .header-content {
      width: 100%;
      max-width: 1100px;
    }

    .logo-circle {
      width: 210px;
      height: 210px;
      margin: 0 auto 22px;
      padding: 20px;
      border: 4px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.8;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 72px);
      font-weight: 800;
      line-height: 1.4;
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(17px, 4vw, 32px);
      line-height: 1.8;
    }

    .container {
      width: calc(100% - 32px);
      max-width: 1300px;
      margin: 34px auto;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 14px;
      direction: ltr;
    }

    .search-box,
    .results {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(35, 53, 91, 0.1);
    }

    .search-box {
      min-height: 88px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      direction: rtl;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #3e506f;
      text-align: right;
      font-size: 22px;
    }

    #searchInput::placeholder {
      color: #8a96a9;
    }

    #searchButton {
      min-height: 88px;
      border: 0;
      border-radius: 22px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-size: 22px;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    #searchButton:hover {
      background: var(--primary-light);
    }

    #searchButton:active {
      transform: scale(0.98);
    }

    .hint {
      margin: 18px 0 34px;
      color: #71809a;
      text-align: center;
      font-size: 17px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(27px, 5vw, 40px);
      font-weight: 800;
    }

    #refreshButton {
      padding: 10px 15px;
      border: 1px solid #dce2ed;
      border-radius: 12px;
      background: #fff;
      color: var(--primary);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .results {
      min-height: 180px;
      padding: 22px;
    }

    .contacts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .contact-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: #fff;
    }

    .contact-name {
      margin-bottom: 7px;
      color: var(--primary);
      font-size: 21px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .job-title {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .phone-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 11px;
      margin-top: 11px;
      border-top: 1px solid #edf0f5;
      font-size: 15px;
    }

    .phone-label {
      color: var(--muted);
      white-space: nowrap;
    }

    .phone-number {
      direction: ltr;
      text-align: left;
      color: #1c3978;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .phone-number a {
      color: inherit;
      text-decoration: none;
    }

    .empty {
      min-height: 125px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8390a7;
      text-align: center;
      font-size: 18px;
    }

    .loading {
      color: var(--primary);
    }

    .error {
      color: var(--danger);
      line-height: 1.9;
    }

    .footer {
      padding: 0 20px max(25px, env(safe-area-inset-bottom));
      color: #8994a8;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 700px) {
      .header {
        min-height: 430px;
      }

      .logo-circle {
        width: 165px;
        height: 165px;
        font-size: 16px;
      }

      .container {
        width: calc(100% - 24px);
        margin: 24px auto;
      }

      .search-area {
        grid-template-columns: 1fr;
        direction: rtl;
      }

      .search-box,
      #searchButton {
        min-height: 66px;
      }

      #searchInput {
        font-size: 18px;
      }

      #searchButton {
        font-size: 19px;
      }

      .hint {
        margin: 15px 0 25px;
        font-size: 15px;
      }

      .results {
        padding: 15px;
        border-radius: 18px;
      }

      .contacts-list {
        grid-template-columns: 1fr;
      }

      .section-header {
        align-items: flex-start;
        flex-direction: column;
      }

      #refreshButton {
        width: 100%;
      }
    }

    @media (max-width: 380px) {
      .phone-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-content">
      <div class="logo-circle">
        الجنسية والجوازات<br>
        Kuwait Police
      </div>

      <h1>دليل أرقام الهواتف</h1>

      <div class="subtitle">
        الإدارة العامة للجنسية ووثائق السفر الكويتية
      </div>
    </div>
  </header>

  <main class="container">

    <div class="search-area">
      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="none"
          placeholder="إبحث بالاسم فقط..."
          aria-label="البحث بالاسم"
        >
      </div>

      <button id="searchButton" type="button">
        بحث 🔍
      </button>
    </div>

    <div class="hint">
      اكتب الاسم ثم اضغط بحث لعرض التفاصيل
    </div>

    <div class="section-header">
      <h2 class="section-title">قائمة الأسماء</h2>
      <button id="refreshButton" type="button">
        تحديث البيانات ↻
      </button>
    </div>

    <section class="results">
      <div id="contactsList" class="contacts-list"></div>

      <div id="emptyMessage" class="empty">
        لا توجد بيانات حالياً
      </div>
    </section>

  </main>

  <footer class="footer">
    دليل أرقام الهواتف - الإدارة العامة للجنسية ووثائق السفر الكويتية
  </footer>

  <script>
    /*
      إعدادات Supabase
    */
    const SUPABASE_URL =
      "https://hxdpfrnxawhyanjwvlmv.supabase.co";

    /*
      استبدل النص التالي بالمفتاح العام فقط:
      Publishable key أو anon public key
    */
    const SUPABASE_ANON_KEY =
      "ضع_المفتاح_العام_هنا";

    /*
      اسم جدول Supabase
    */
    const TABLE_NAME = "contacts";

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const refreshButton = document.getElementById("refreshButton");
    const contactsList = document.getElementById("contactsList");
    const emptyMessage = document.getElementById("emptyMessage");

    let allContacts = [];

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    function safe(value) {
      return value === null || value === undefined
        ? ""
        : String(value);
    }

    function escapeHtml(value) {
      return safe(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizePhone(value) {
      return safe(value).replace(/[^\d+]/g, "");
    }

    function phoneRow(label, value) {
      if (!safe(value).trim()) {
        return "";
      }

      const phone = normalizePhone(value);

      return `
        <div class="phone-row">
          <span class="phone-label">${escapeHtml(label)}</span>
          <span class="phone-number">
            <a href="tel:${escapeHtml(phone)}">
              ${escapeHtml(value)}
            </a>
          </span>
        </div>
      `;
    }

    function showMessage(message, className = "") {
      contactsList.innerHTML = "";

      emptyMessage.className = `empty ${className}`;
      emptyMessage.innerHTML = message;
      emptyMessage.style.display = "flex";
    }

    function displayContacts(contacts) {
      contactsList.innerHTML = "";

      if (!contacts || contacts.length === 0) {
        emptyMessage.className = "empty";
        emptyMessage.textContent = "لا توجد نتائج مطابقة";
        emptyMessage.style.display = "flex";
        return;
      }

      emptyMessage.style.display = "none";

      contacts.forEach(contact => {
        const card = document.createElement("article");
        card.className = "contact-card";

        card.innerHTML = `
          <div class="contact-name">
            ${escapeHtml(contact.name || "بدون اسم")}
          </div>

          ${
            safe(contact.job_title).trim()
              ? `
                <div class="job-title">
                  ${escapeHtml(contact.job_title)}
                </div>
              `
              : ""
          }

          ${phoneRow("الرقم الداخلي", contact.internal_number)}
          ${phoneRow("الرقم المباشر", contact.direct_number)}
          ${phoneRow("رقم الهاتف", contact.mobile_number)}
        `;

        contactsList.appendChild(card);
      });
    }

    async function loadContacts() {
      showMessage("جاري تحميل البيانات...", "loading");

      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select("*")
          .order("name", { ascending: true });

        if (error) {
          throw error;
        }

        allContacts = Array.isArray(data) ? data : [];
        displayContacts(allContacts);

      } catch (error) {
        console.error("Supabase error:", error);

        showMessage(
          "تعذر تحميل البيانات.<br>تأكد من المفتاح واسم الجدول وصلاحيات القراءة.",
          "error"
        );
      }
    }

    function searchContacts() {
      const searchText = searchInput.value.trim().toLowerCase();

      if (!searchText) {
        displayContacts(allContacts);
        return;
      }

      const filteredContacts = allContacts.filter(contact => {
        const name = safe(contact.name).toLowerCase();
        return name.includes(searchText);
      });

      displayContacts(filteredContacts);
    }

    searchButton.addEventListener("click", searchContacts);

    refreshButton.addEventListener("click", loadContacts);

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchContacts();
      }
    });

    /*
      البحث أثناء الكتابة على الآيفون والكمبيوتر
    */
    searchInput.addEventListener("input", () => {
      searchContacts();
    });

    /*
      بدء تحميل البيانات
    */
    loadContacts();
  </script>

</body>
</html>
