<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#172e66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>دليل أرقام الهواتف</title>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- الخط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #172e66;
      --primary-light: #2d4d92;
      --text: #17346f;
      --muted: #77859a;
      --background: #f5f7fc;
      --border: #e4e9f2;
      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at top right,
          rgba(42, 72, 135, 0.08),
          transparent 35%),
        var(--background);
      color: var(--text);
      font-family: "Cairo", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }

    /* الهيدر */

    .header {
      position: relative;
      min-height: 430px;
      padding: 38px 20px 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      text-align: center;
      background:
        linear-gradient(135deg,
          #112554 0%,
          #1d3976 55%,
          #2c4c91 100%);
    }

    .header::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      left: -180px;
      top: -180px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      box-shadow:
        0 0 0 35px rgba(255, 255, 255, 0.025),
        0 0 0 70px rgba(255, 255, 255, 0.02);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      right: -260px;
      bottom: -320px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      box-shadow:
        0 0 0 35px rgba(255, 255, 255, 0.025),
        0 0 0 70px rgba(255, 255, 255, 0.02);
    }

    .header-content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    /* الشعار */

    .logo-wrapper {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.22),
        0 0 0 5px rgba(255, 255, 255, 0.08);
    }

    .official-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
    }

    /* العناوين */

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(36px, 6vw, 68px);
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -1px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    .subtitle {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(16px, 2.8vw, 27px);
      line-height: 1.8;
    }

    /* المحتوى */

    .container {
      position: relative;
      z-index: 5;
      width: min(1180px, calc(100% - 36px));
      margin: -45px auto 38px;
    }

    /* منطقة البحث */

    .search-area {
      display: grid;
      grid-template-columns: 1fr 170px;
      gap: 0;
      padding: 9px;
      direction: ltr;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 14px 35px rgba(20, 42, 85, 0.16);
      backdrop-filter: blur(12px);
    }

    .search-box {
      min-height: 70px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      border-radius: 14px;
      background: #fff;
      direction: rtl;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #1d376e;
      text-align: right;
      font-size: 20px;
      font-weight: 600;
    }

    #searchInput::placeholder {
      color: #8a96a9;
    }

    #searchButton {
      min-height: 70px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #172f68, #2a4b91);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(25, 45, 97, 0.25);
      font-size: 19px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    #searchButton:hover {
      background: linear-gradient(135deg, #102657, #203e80);
    }

    #searchButton:active {
      transform: scale(0.98);
    }

    /* التعليمات */

    .hint {
      margin: 15px 0 30px;
      color: #71809a;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }

    /* عنوان القائمة */

    .section-header {
      min-height: 52px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .section-title {
      margin: 0;
      color: #17346f;
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 800;
    }

    #refreshButton {
      padding: 10px 15px;
      border: 0;
      border-radius: 12px;
      background: #e9eef9;
      color: #1b3978;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    #refreshButton:hover {
      background: #dce5f7;
      transform: translateY(-1px);
    }

    /* النتائج */

    .results {
      min-height: 190px;
      padding: 20px;
      border: 1px solid #e8edf6;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(28, 50, 93, 0.08);
    }

    .contacts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }

    /* بطاقات الأسماء */

    .contact-card {
      position: relative;
      padding: 20px;
      overflow: hidden;
      border: 1px solid #e5eaf3;
      border-radius: 16px;
      background: linear-gradient(145deg, #ffffff, #f9fbff);
      box-shadow: 0 5px 15px rgba(25, 48, 92, 0.05);
      transition: 0.2s ease;
    }

    .contact-card::before {
      content: "";
      position: absolute;
      right: 0;
      top: 16px;
      bottom: 16px;
      width: 4px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(#24488d, #70a1df);
    }

    .contact-card:hover {
      border-color: #cbd8ef;
      box-shadow: 0 10px 23px rgba(25, 48, 92, 0.1);
      transform: translateY(-2px);
    }

    .contact-name {
      padding-right: 7px;
      margin-bottom: 7px;
      color: #173a7b;
      font-size: 20px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .job-title {
      padding-right: 7px;
      margin-bottom: 14px;
      color: #7b899e;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .phone-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 11px;
      margin-top: 11px;
      border-top: 1px solid #edf0f5;
      font-size: 15px;
    }

    .phone-label {
      color: var(--muted);
      white-space: nowrap;
    }

    .phone-number {
      direction: ltr;
      color: #1c3978;
      text-align: left;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .phone-number a {
      color: inherit;
      text-decoration: none;
    }

    /* الرسائل */

    .empty {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b8ba5;
      text-align: center;
      font-size: 17px;
      line-height: 2;
    }

    .loading {
      color: var(--primary);
    }

    .error {
      color: var(--danger);
    }

    /* التذييل */

    .footer {
      padding: 0 20px max(25px, env(safe-area-inset-bottom));
      color: #8994a8;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
    }

    /* الآيفون والأجهزة الصغيرة */

    @media (max-width: 700px) {
      .header {
        min-height: 390px;
        padding: 28px 16px 50px;
      }

      .logo-wrapper {
        width: 125px;
        height: 125px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 36px;
        line-height: 1.35;
      }

      .subtitle {
        max-width: 330px;
        margin: 8px auto 0;
        font-size: 16px;
        line-height: 1.8;
      }

      .container {
        width: calc(100% - 24px);
        margin-top: -32px;
      }

      .search-area {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border-radius: 18px;
      }

      .search-box {
        min-height: 60px;
        padding: 0 17px;
      }

      #searchInput {
        font-size: 17px;
      }

      #searchButton {
        width: 100%;
        min-height: 58px;
        font-size: 18px;
      }

      .hint {
        margin: 13px 0 23px;
        font-size: 14px;
      }

      .section-header {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .section-title {
        font-size: 26px;
      }

      #refreshButton {
        width: 100%;
        min-height: 42px;
        padding: 8px 12px;
        font-size: 13px;
      }

      .results {
        padding: 12px;
        border-radius: 17px;
      }

      .contacts-list {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .contact-card {
        padding: 17px;
      }
    }

    @media (max-width: 390px) {
      .header {
        min-height: 365px;
      }

      .logo-wrapper {
        width: 108px;
        height: 108px;
      }

      h1 {
        font-size: 31px;
      }

      .subtitle {
        font-size: 14px;
      }

      .phone-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <!-- الهيدر -->
  <header class="header">
    <div class="header-content">

      <!-- يجب وضع logo.PNG بجانب index.html -->
      <div class="logo-wrapper">
        <img
          src="logo.PNG"
          alt="شعار الإدارة العامة للجنسية ووثائق السفر"
          class="official-logo"
        >
      </div>

      <h1>دليل أرقام الهواتف</h1>

      <div class="subtitle">
        الإدارة العامة للجنسية ووثائق السفر الكويتية
      </div>

    </div>
  </header>

  <!-- المحتوى -->
  <main class="container">

    <!-- البحث -->
    <div class="search-area">

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="none"
          placeholder="إبحث بالاسم فقط..."
          aria-label="البحث بالاسم"
        >
      </div>

      <button id="searchButton" type="button">
        بحث 🔍
      </button>

    </div>

    <div class="hint">
      اكتب الاسم ثم اضغط بحث لعرض التفاصيل
    </div>

    <!-- عنوان القائمة -->
    <div class="section-header">
      <h2 class="section-title">قائمة الأسماء</h2>

      <button id="refreshButton" type="button">
        تحديث البيانات ↻
      </button>
    </div>

    <!-- النتائج -->
    <section class="results">
      <div id="contactsList" class="contacts-list"></div>

      <div id="emptyMessage" class="empty">
        جاري تحميل البيانات...
      </div>
    </section>

  </main>

  <footer class="footer">
    دليل أرقام الهواتف - الإدارة العامة للجنسية ووثائق السفر الكويتية
  </footer>

  <script>
    /*
      إعدادات Supabase
    */

    const SUPABASE_URL =
      "https://hxdpfrnxawhyanjwvlmv.supabase.co";

    /*
      ضع هنا Publishable key أو anon public key
      من Supabase > Project Settings > API
    */

    const SUPABASE_ANON_KEY =
      "ضع_المفتاح_العام_هنا";

    /*
      اسم جدول Supabase
    */

    const TABLE_NAME = "contacts";


    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const refreshButton = document.getElementById("refreshButton");
    const contactsList = document.getElementById("contactsList");
    const emptyMessage = document.getElementById("emptyMessage");

    let allContacts = [];

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    function safe(value) {
      return value === null || value === undefined
        ? ""
        : String(value);
    }


    function escapeHtml(value) {
      return safe(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function normalizePhone(value) {
      return safe(value).replace(/[^\d+]/g, "");
    }


    function phoneRow(label, value) {
      if (!safe(value).trim()) {
        return "";
      }

      const phone = normalizePhone(value);

      return `
        <div class="phone-row">
          <span class="phone-label">
            ${escapeHtml(label)}
          </span>

          <span class="phone-number">
            <a href="tel:${escapeHtml(phone)}">
              ${escapeHtml(value)}
            </a>
          </span>
        </div>
      `;
    }


    function showMessage(message, className = "") {
      contactsList.innerHTML = "";

      emptyMessage.className = `empty ${className}`;
      emptyMessage.innerHTML = message;
      emptyMessage.style.display = "flex";
    }


    function displayContacts(contacts) {
      contactsList.innerHTML = "";

      if (!contacts || contacts.length === 0) {
        emptyMessage.className = "empty";
        emptyMessage.textContent = "لا توجد نتائج مطابقة";
        emptyMessage.style.display = "flex";
        return;
      }

      emptyMessage.style.display = "none";

      contacts.forEach(contact => {
        const card = document.createElement("article");
        card.className = "contact-card";

        card.innerHTML = `
          <div class="contact-name">
            ${escapeHtml(contact.name || "بدون اسم")}
          </div>

          ${
            safe(contact.job_title).trim()
              ? `
                <div class="job-title">
                  ${escapeHtml(contact.job_title)}
                </div>
              `
              : ""
          }

          ${phoneRow("الرقم الداخلي", contact.internal_number)}
          ${phoneRow("الرقم المباشر", contact.direct_number)}
          ${phoneRow("رقم الهاتف", contact.mobile_number)}
        `;

        contactsList.appendChild(card);
      });
    }


    async function loadContacts() {
      showMessage("جاري تحميل البيانات...", "loading");

      try {
        const {
          data,
          error
        } = await supabaseClient
          .from(TABLE_NAME)
          .select("*")
          .order("name", {
            ascending: true
          });

        if (error) {
          throw error;
        }

        allContacts = Array.isArray(data) ? data : [];

        if (allContacts.length === 0) {
          showMessage("لا توجد بيانات حالياً");
        } else {
          displayContacts(allContacts);
        }

      } catch (error) {
        console.error("Supabase error:", error);

        showMessage(
          "تعذر تحميل البيانات.<br>" +
          "تأكد من المفتاح واسم الجدول وصلاحيات القراءة.",
          "error"
        );
      }
    }


    function searchContacts() {
      const searchText = searchInput.value.trim().toLowerCase();

      if (!searchText) {
        displayContacts(allContacts);
        return;
      }

      const filteredContacts = allContacts.filter(contact => {
        const name = safe(contact.name).toLowerCase();

        return name.includes(searchText);
      });

      displayContacts(filteredContacts);
    }


    searchButton.addEventListener("click", searchContacts);

    refreshButton.addEventListener("click", loadContacts);

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchContacts();
      }
    });

    /*
      البحث أثناء الكتابة
    */

    searchInput.addEventListener("input", searchContacts);


    /*
      تحميل البيانات عند فتح الموقع
    */

    loadContacts();
  </script>

</body>

</html>
