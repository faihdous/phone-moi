<script>
let contacts = [];

/*
  تنظيف النصوص والأرقام
*/
function clean(value) {
  return String(value ?? "")
    .replace(/[‏\u200e\u200f]/g, "")
    .replace(/\.0+$/, "")
    .replace(/\s+/g, " ")
    .trim();
}

/*
  حماية النص قبل عرضه داخل الصفحة
*/
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char];
  });
}

/*
  تحويل رقم الهاتف إلى صيغة واتساب الكويت
*/
function whatsappNumber(number) {
  let value = clean(number).replace(/[^\d+]/g, "");

  if (!value) {
    return "";
  }

  if (value.startsWith("+")) {
    value = value.substring(1);
  }

  if (value.startsWith("00")) {
    value = value.substring(2);
  }

  if (value.startsWith("965")) {
    return value;
  }

  if (value.startsWith("0")) {
    value = value.substring(1);
  }

  return "965" + value;
}

function whatsappLink(number) {
  const formattedNumber = whatsappNumber(number);

  if (!formattedNumber) {
    return "#";
  }

  return "https://wa.me/" + formattedNumber;
}

/*
  توحيد أسماء البيانات القادمة من API
  حتى يعمل الموقع سواء رجعت البيانات بالأسماء الجديدة أو القديمة
*/
function normalizeContact(contact) {
  return {
    name: clean(contact.name),

    // الاسم الجديد في Supabase هو job_title
    job: clean(
      contact.job_title ||
      contact.job ||
      contact.position ||
      ""
    ),

    // employee_number هو الرقم الداخلي حسب جدول Supabase
    internal: clean(
      contact.employee_number ||
      contact.internal ||
      contact.extension ||
      ""
    ),

    // دعم الأسماء القديمة إذا كانت موجودة في API
    direct: clean(
      contact.direct ||
      contact.direct_phone ||
      contact.phone ||
      ""
    ),

    mobile: clean(
      contact.mobile ||
      contact.mobile_phone ||
      contact.whatsapp ||
      ""
    )
  };
}

/*
  البحث عن الموظف بالاسم
*/
async function searchByName() {
  const search = clean(
    document.getElementById("searchName").value
  );

  const results = document.getElementById("results");

  if (!search) {
    results.innerHTML =
      '<div class="empty">اكتب اسم الشخص في خانة البحث</div>';
    return;
  }

  results.innerHTML =
    '<div class="empty">جاري البحث...</div>';

  try {
    const response = await fetch(
      "/api/contacts?search=" + encodeURIComponent(search)
    );

    if (!response.ok) {
      throw new Error("فشل الاتصال بالخادم");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("البيانات المستلمة غير صحيحة");
    }

    contacts = data.map(normalizeContact);

    if (!contacts.length) {
      results.innerHTML =
        '<div class="empty">لم يتم العثور على الاسم</div>';
      return;
    }

    results.innerHTML = contacts.map(function(contact, index) {
      return `
        <div class="card">
          <div class="name">
            ${escapeHTML(contact.name || "بدون اسم")}
          </div>

          <div class="job">
            ${escapeHTML(contact.job || "المسمى الوظيفي غير متوفر")}
          </div>

          <button onclick="showDetails(${index})">
            عرض التفاصيل
          </button>
        </div>
      `;
    }).join("");

  } catch (error) {
    console.error(error);

    results.innerHTML =
      '<div class="empty">حدث خطأ أثناء تحميل البيانات</div>';
  }
}

/*
  عرض تفاصيل الموظف
*/
function showDetails(index) {
  const contact = contacts[index];

  if (!contact) {
    return;
  }

  const oldDetails = document.getElementById("details");

  if (oldDetails) {
    oldDetails.remove();
  }

  let buttons = "";

  if (contact.direct) {
    buttons += `
      <a href="tel:${escapeHTML(contact.direct)}">
        <button class="call-button">
          📞 اتصال بالرقم المباشر
        </button>
      </a>
    `;
  }

  if (contact.mobile) {
    buttons += `
      <a href="tel:${escapeHTML(contact.mobile)}">
        <button class="mobile-button">
          📱 اتصال بالهاتف المحمول
        </button>
      </a>

      <a
        href="${whatsappLink(contact.mobile)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        <button class="whatsapp-button">
          💬 واتساب الهاتف المحمول
        </button>
      </a>
    `;
  }

  const card = document.createElement("div");

  card.id = "details";
  card.className = "card";

  card.innerHTML = `
    <div class="name">
      ${escapeHTML(contact.name || "بدون اسم")}
    </div>

    <div class="job">
      ${escapeHTML(contact.job || "المسمى الوظيفي غير متوفر")}
    </div>

    <div class="details">

      <div class="detail">
        <div class="detail-label">
          الرقم الداخلي
        </div>

        <div class="detail-value">
          ${escapeHTML(contact.internal || "غير متوفر")}
        </div>
      </div>

      <div class="detail">
        <div class="detail-label">
          الرقم المباشر
        </div>

        <div class="detail-value">
          ${escapeHTML(contact.direct || "غير متوفر")}
        </div>
      </div>

      <div class="detail">
        <div class="detail-label">
          الهاتف المحمول
        </div>

        <div class="detail-value">
          ${escapeHTML(contact.mobile || "غير متوفر")}
        </div>
      </div>

    </div>

    <div class="actions">
      ${
        buttons ||
        '<span style="color:#78869a;">لا توجد أرقام اتصال متوفرة</span>'
      }
    </div>
  `;

  document.getElementById("results").appendChild(card);

  card.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
</script>
