<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل أرقام الهواتف</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      color: #17346f;
      font-family: Cairo, Arial, sans-serif;
    }

    .header {
      min-height: 548px;
      padding: 35px 20px 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #192d61, #233d79);
    }

    .header-content {
      width: 100%;
      max-width: 1100px;
    }

    .logo-circle {
      width: 230px;
      height: 230px;
      margin: 0 auto 22px;
      border: 4px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.8;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 76px);
      font-weight: 800;
      line-height: 1.4;
    }

    .subtitle {
      margin: 12px 0 0;
      font-size: clamp(20px, 3vw, 35px);
    }

    .container {
      width: calc(100% - 36px);
      max-width: 2440px;
      margin: 50px auto;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      direction: ltr;
    }

    .search-box,
    .results {
      background: white;
      border-radius: 26px;
      box-shadow: 0 8px 25px rgba(35, 53, 91, .1);
    }

    .search-box {
      min-height: 145px;
      padding: 25px 38px;
      display: flex;
      align-items: center;
      direction: rtl;
    }

    #searchInput {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      text-align: right;
      color: #5f6f87;
      font-family: inherit;
      font-size: 30px;
    }

    #searchInput::placeholder {
      color: #7d899b;
    }

    #searchButton {
      min-height: 145px;
      border: 0;
      border-radius: 26px;
      background: #1d3268;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 31px;
      transition: .2s;
    }

    #searchButton:hover {
      background: #294585;
    }

    .hint {
      margin: 22px 0 38px;
      text-align: center;
      color: #71809a;
      font-size: 24px;
    }

    .section-title {
      margin: 0 0 24px;
      font-size: 42px;
      font-weight: 800;
    }

    .results {
      min-height: 180px;
      padding: 30px;
    }

    .contacts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .contact-card {
      padding: 22px;
      border: 1px solid #e4e8f0;
      border-radius: 18px;
      background: white;
    }

    .contact-name {
      margin-bottom: 12px;
      color: #1d3268;
      font-size: 24px;
      font-weight: 800;
    }

    .job-title {
      margin-bottom: 14px;
      color: #78869d;
      font-size: 17px;
    }

    .phone-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid #edf0f5;
      font-size: 17px;
    }

    .phone-label {
      color: #77859a;
    }

    .phone-number {
      direction: ltr;
      text-align: left;
      color: #1c3978;
      font-weight: 700;
    }

    .empty {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8390a7;
      text-align: center;
      font-size: 25px;
    }

    .footer {
      padding: 0 20px 30px;
      color: #8994a8;
      text-align: center;
      font-size: 16px;
    }

    @media (max-width: 900px) {
      .header {
        min-height: 430px;
      }

      .search-area {
        grid-template-columns: 1fr;
        direction: rtl;
      }

      .search-box,
      #searchButton {
        min-height: 100px;
      }

      #searchInput {
        font-size: 23px;
      }

      .hint {
        font-size: 18px;
      }

      .section-title {
        font-size: 32px;
      }
    }

    @media (max-width: 500px) {
      .container {
        width: calc(100% - 24px);
        margin: 25px auto;
      }

      .logo-circle {
        width: 170px;
        height: 170px;
        font-size: 17px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 19px;
      }

      .search-box {
        padding: 20px;
      }

      .results {
        padding: 18px;
      }

      .contacts-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-content">
      <div class="logo-circle">
        الجنسية والجوازات<br>
        Kuwait Police
      </div>

      <h1>دليل أرقام الهواتف</h1>

      <div class="subtitle">
        الإدارة العامة للجنسية ووثائق السفر الكويتية
      </div>
    </div>
  </header>

  <main class="container">

    <div class="search-area">
      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="إبحث بالاسم فقط..."
        >
      </div>

      <button id="searchButton">
        بحث 🔍
      </button>
    </div>

    <div class="hint">
      اكتب الاسم ثم اضغط بحث لعرض التفاصيل
    </div>

    <h2 class="section-title">قائمة الأسماء</h2>

    <section class="results">
      <div id="contactsList" class="contacts-list"></div>
      <div id="emptyMessage" class="empty">
        لا توجد بيانات حالياً، أضف الأسماء من قسم الإدارة
      </div>
    </section>

  </main>

  <footer class="footer">
    دليل أرقام الهواتف - الإدارة العامة للجنسية ووثائق السفر الكويتية
  </footer>

  <script>
    const contacts = [
      /*
        أضف بياناتك بهذا الشكل:

        {
          name: "الاسم",
          job_title: "المسمى الوظيفي",
          internal_number: "1234",
          direct_number: "22500000",
          mobile_number: "50000000"
        }
      */
    ];

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const contactsList = document.getElementById("contactsList");
    const emptyMessage = document.getElementById("emptyMessage");

    function safe(value) {
      return value == null ? "" : String(value);
    }

    function escapeHtml(value) {
      return safe(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function displayContacts(list) {
      contactsList.innerHTML = "";

      if (!list.length) {
        emptyMessage.style.display = "flex";
        return;
      }

      emptyMessage.style.display = "none";

      list.forEach(contact => {
        const card = document.createElement("article");
        card.className = "contact-card";

        card.innerHTML = `
          <div class="contact-name">
            ${escapeHtml(contact.name || "بدون اسم")}
          </div>

          ${
            contact.job_title
              ? `<div class="job-title">${escapeHtml(contact.job_title)}</div>`
              : ""
          }

          ${
            contact.internal_number
              ? `<div class="phone-row">
                  <span class="phone-label">الرقم الداخلي</span>
                  <span class="phone-number">${escapeHtml(contact.internal_number)}</span>
                </div>`
              : ""
          }

          ${
            contact.direct_number
              ? `<div class="phone-row">
                  <span class="phone-label">الرقم المباشر</span>
                  <span class="phone-number">${escapeHtml(contact.direct_number)}</span>
                </div>`
              : ""
          }

          ${
            contact.mobile_number
              ? `<div class="phone-row">
                  <span class="phone-label">رقم الهاتف</span>
                  <span class="phone-number">${escapeHtml(contact.mobile_number)}</span>
                </div>`
              : ""
          }
        `;

        contactsList.appendChild(card);
      });
    }

    function searchContacts() {
      const text = searchInput.value.trim().toLowerCase();

      const filtered = contacts.filter(contact =>
        safe(contact.name).toLowerCase().includes(text)
      );

      displayContacts(filtered);
    }

    searchButton.addEventListener("click", searchContacts);

    searchInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchContacts();
      }
    });

    displayContacts(contacts);
  </script>

</body>
</html>
