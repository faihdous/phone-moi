<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دليل أرقام الهواتف</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6fa;
      color: #24344d;
      font-family: Tahoma, Arial, sans-serif;
    }

    header {
      background: linear-gradient(120deg, #031f4d, #073a7a);
      color: #fff;
      text-align: center;
      padding: 25px 15px;
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 20px;
    }

    .container {
      width: 100%;
      max-width: 1350px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .search-area {
      display: flex;
      width: 100%;
      gap: 12px;
      margin-bottom: 10px;
    }

    .search-area input {
      flex: 1;
      min-width: 0;
      height: 72px;
      padding: 20px;
      border: 0;
      border-radius: 13px;
      outline: 0;
      font-family: inherit;
      font-size: 20px;
      color: #24344d;
      background: #fff;
      box-shadow: 0 3px 12px #16345d20;
    }

    .search-area button {
      flex: 0 0 170px;
      height: 72px;
      border-radius: 13px;
      font-size: 18px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      background: #06295c;
    }

    button:hover {
      opacity: 0.85;
    }

    .help {
      text-align: center;
      color: #66758c;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .results-title {
      color: #06295c;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 3px 13px #16345d20;
    }

    .name {
      color: #06295c;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .job {
      color: #5d6a80;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .detail {
      background: #f0f4fb;
      padding: 14px;
      border-radius: 9px;
    }

    .detail-label {
      color: #68758a;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .detail-value {
      color: #0750bc;
      font-size: 20px;
      font-weight: bold;
      direction: ltr;
      text-align: right;
      word-break: break-word;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .actions a {
      text-decoration: none;
    }

    .call-button {
      background: #13a653;
    }

    .mobile-button {
      background: #087da5;
    }

    .whatsapp-button {
      background: #25d366;
    }

    .empty {
      background: #fff;
      border-radius: 14px;
      padding: 35px;
      text-align: center;
      color: #78869a;
      box-shadow: 0 3px 13px #16345d20;
    }

    footer {
      margin-top: 35px;
      padding: 20px;
      background: #052656;
      color: #fff;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      header h1 {
        font-size: 29px;
      }

      header p {
        font-size: 16px;
        line-height: 1.8;
      }

      .logo {
        width: 120px;
        height: 120px;
      }

      .container {
        padding: 0 10px;
        margin-top: 20px;
      }

      .search-area {
        flex-direction: column;
      }

      .search-area input {
        width: 100%;
        height: 68px;
        font-size: 19px;
      }

      .search-area button {
        width: 100%;
        height: 62px;
        flex: none;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      .name {
        font-size: 20px;
      }

      .detail-value {
        font-size: 18px;
      }

      .actions a,
      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <img src="logo.PNG" class="logo" alt="شعار الإدارة">

    <h1>دليل أرقام الهواتف</h1>

    <p>
      الإدارة العامة للجنسية ووثائق السفر الكويتية
    </p>
  </header>

  <main class="container">

    <div class="search-area">
      <input
        id="searchName"
        type="text"
        placeholder="ابحث بالاسم فقط..."
        onkeydown="if (event.key === 'Enter') searchByName()"
      >

      <button onclick="searchByName()">
        🔍 بحث
      </button>
    </div>

    <div class="help">
      اكتب الاسم ثم اضغط بحث لعرض التفاصيل
    </div>

    <div class="results-title">
      قائمة الأسماء
    </div>

    <div id="results">
      <div class="empty">
        اكتب اسم الشخص في خانة البحث
      </div>
    </div>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2024 -
    الإدارة العامة للجنسية ووثائق السفر الكويتية
  </footer>

  <script>
    let contacts = [];

    function clean(value) {
      return String(value ?? "")
        .replace(/[‏\u200e\u200f]/g, "")
        .replace(/\.0+$/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];
      });
    }

    function whatsappNumber(number) {
      let value = clean(number).replace(/[^\d+]/g, "");

      if (!value) {
        return "";
      }

      if (value.startsWith("+")) {
        value = value.substring(1);
      }

      if (value.startsWith("00")) {
        value = value.substring(2);
      }

      if (value.startsWith("965")) {
        return value;
      }

      if (value.startsWith("0")) {
        value = value.substring(1);
      }

      return "965" + value;
    }

    function whatsappLink(number) {
      const numberForWhatsapp = whatsappNumber(number);

      if (!numberForWhatsapp) {
        return "#";
      }

      return "https://wa.me/" + numberForWhatsapp;
    }

    function normalizeContact(contact) {
      return {
        name: clean(contact.name),

        job: clean(
          contact.job_title ||
          contact.job ||
          contact.position ||
          ""
        ),

        internal: clean(
          contact.employee_number ||
          contact.internal ||
          contact.extension ||
          ""
        ),

        direct: clean(
          contact.direct ||
          contact.direct_phone ||
          contact.phone ||
          ""
        ),

        mobile: clean(
          contact.mobile ||
          contact.mobile_phone ||
          contact.whatsapp ||
          ""
        )
      };
    }

    async function searchByName() {
      const search = clean(
        document.getElementById("searchName").value
      );

      const results = document.getElementById("results");

      if (!search) {
        results.innerHTML =
          '<div class="empty">اكتب اسم الشخص في خانة البحث</div>';
        return;
      }

      results.innerHTML =
        '<div class="empty">جاري البحث...</div>';

      try {
        const response = await fetch(
          "/api/contacts?search=" + encodeURIComponent(search)
        );

        if (!response.ok) {
          throw new Error("فشل الاتصال");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("البيانات غير صحيحة");
        }

        contacts = data.map(normalizeContact);

        if (!contacts.length) {
          results.innerHTML =
            '<div class="empty">لم يتم العثور على الاسم</div>';
          return;
        }

        results.innerHTML = contacts.map(function(contact, index) {
          return `
            <div class="card">
              <div class="name">
                ${escapeHTML(contact.name || "بدون اسم")}
              </div>

              <div class="job">
                ${escapeHTML(
                  contact.job || "المسمى الوظيفي غير متوفر"
                )}
              </div>

              <button onclick="showDetails(${index})">
                عرض التفاصيل
              </button>
            </div>
          `;
        }).join("");

      } catch (error) {
        console.error(error);

        results.innerHTML =
          '<div class="empty">حدث خطأ أثناء تحميل البيانات</div>';
      }
    }

    function showDetails(index) {
      const contact = contacts[index];

      if (!contact) {
        return;
      }

      const oldDetails = document.getElementById("details");

      if (oldDetails) {
        oldDetails.remove();
      }

      let buttons = "";

      if (contact.direct) {
        buttons += `
          <a href="tel:${escapeHTML(contact.direct)}">
            <button class="call-button">
              📞 اتصال بالرقم المباشر
            </button>
          </a>
        `;
      }

      if (contact.mobile) {
        buttons += `
          <a href="tel:${escapeHTML(contact.mobile)}">
            <button class="mobile-button">
              📱 اتصال بالهاتف المحمول
            </button>
          </a>

          <a
            href="${whatsappLink(contact.mobile)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <button class="whatsapp-button">
              💬 واتساب الهاتف المحمول
            </button>
          </a>
        `;
      }

      if (!buttons) {
        buttons =
          '<span style="color:#78869a;">لا توجد أرقام اتصال متوفرة</span>';
      }

      const card = document.createElement("div");

      card.id = "details";
      card.className = "card";

      card.innerHTML = `
        <div class="name">
          ${escapeHTML(contact.name || "بدون اسم")}
        </div>

        <div class="job">
          ${escapeHTML(
            contact.job || "المسمى الوظيفي غير متوفر"
          )}
        </div>

        <div class="details">

          <div class="detail">
            <div class="detail-label">
              الرقم الداخلي
            </div>

            <div class="detail-value">
              ${escapeHTML(contact.internal || "غير متوفر")}
            </div>
          </div>

          <div class="detail">
            <div class="detail-label">
              الرقم المباشر
            </div>

            <div class="detail-value">
              ${escapeHTML(contact.direct || "غير متوفر")}
            </div>
          </div>

          <div class="detail">
            <div class="detail-label">
              الهاتف المحمول
            </div>

            <div class="detail-value">
              ${escapeHTML(contact.mobile || "غير متوفر")}
            </div>
          </div>

        </div>

        <div class="actions">
          ${buttons}
        </div>
      `;

      document.getElementById("results").appendChild(card);

      card.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  </script>

</body>
</html>
