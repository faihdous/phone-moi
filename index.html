<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دليل أرقام الموظفين</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fc;
      color: #17346f;
      font-family: "Cairo", Arial, sans-serif;
    }

    .header {
      min-height: 390px;
      padding: 35px 20px 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #102451, #3d5796);
    }

    .logo-wrapper {
      width: 145px;
      height: 145px;
      margin: 0 auto 20px;
      padding: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }

    .official-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      color: white;
      font-size: clamp(32px, 6vw, 60px);
      font-weight: 800;
    }

    .subtitle {
      margin-top: 10px;
      color: white;
      font-size: clamp(16px, 2.5vw, 25px);
    }

    .container {
      width: min(1180px, calc(100% - 30px));
      margin: -45px auto 35px;
      position: relative;
      z-index: 2;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 30px rgba(20, 42, 85, 0.16);
    }

    .search-box {
      min-height: 62px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    #searchInput {
      width: 100%;
      border: 0;
      outline: 0;
      color: #17346f;
      font-family: inherit;
      font-size: 18px;
      text-align: right;
    }

    #searchButton {
      min-height: 62px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, #17346f, #31569d);
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
    }

    #searchButton:hover {
      background: linear-gradient(135deg, #102451, #24488d);
    }

    .hint {
      margin: 14px 0 28px;
      color: #78869b;
      text-align: center;
      font-size: 14px;
    }

    .section-title {
      margin: 0 0 15px;
      font-size: 30px;
      font-weight: 800;
    }

    .results {
      min-height: 180px;
      padding: 18px;
      border: 1px solid #e2e8f2;
      border-radius: 18px;
      background: white;
      box-shadow: 0 7px 22px rgba(28, 50, 93, 0.07);
    }

    .contacts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
    }

    .contact-card {
      position: relative;
      padding: 20px;
      border: 1px solid #e2e8f2;
      border-radius: 15px;
      background: linear-gradient(145deg, #ffffff, #f9fbff);
      box-shadow: 0 4px 13px rgba(25, 48, 92, 0.08);
    }

    .contact-card::before {
      content: "";
      position: absolute;
      right: 0;
      top: 16px;
      bottom: 16px;
      width: 4px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(#24488d, #70a1df);
    }

    .contact-name {
      padding-right: 8px;
      margin-bottom: 8px;
      color: #173a7b;
      font-size: 22px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .job-title {
      padding-right: 8px;
      margin-bottom: 14px;
      color: #78869b;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding-top: 11px;
      margin-top: 11px;
      border-top: 1px solid #edf0f5;
    }

    .data-label {
      color: #78869b;
      white-space: nowrap;
    }

    .data-value {
      color: #1c3978;
      font-weight: 700;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .phone-value {
      direction: ltr;
    }

    .phone-value a {
      color: #1c3978;
      text-decoration: none;
    }

    .empty {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #78869b;
      text-align: center;
      line-height: 2;
    }

    .error {
      color: #c62828;
    }

    .footer {
      padding: 0 20px 25px;
      color: #8994a8;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .header {
        min-height: 350px;
        padding: 28px 15px 55px;
      }

      .logo-wrapper {
        width: 115px;
        height: 115px;
      }

      .container {
        width: calc(100% - 22px);
        margin-top: -32px;
      }

      .search-area {
        display: flex;
        flex-direction: column;
      }

      .search-box,
      #searchButton {
        min-height: 58px;
      }

      .contacts-list {
        grid-template-columns: 1fr;
      }

      .data-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div>
      <div class="logo-wrapper">
        <img src="logo.PNG" alt="الشعار" class="official-logo">
      </div>

      <h1>دليل أرقام الموظفين</h1>

      <div class="subtitle">
        الإدارة العامة للجنسية ووثائق السفر الكويتية
      </div>
    </div>
  </header>

  <main class="container">

    <div class="search-area">
      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="إبحث بالاسم..."
          autocomplete="off">
      </div>

      <button id="searchButton" type="button">
        بحث 🔍
      </button>
    </div>

    <div class="hint">
      اكتب الاسم ثم اضغط على زر البحث لعرض التفاصيل
    </div>

    <h2 class="section-title">
      قائمة الأسماء
    </h2>

    <section class="results">
      <div id="contactsList" class="contacts-list"></div>

      <div id="emptyMessage" class="empty">
        اكتب اسم الموظف ثم اضغط بحث
      </div>
    </section>

  </main>

  <footer class="footer">
    دليل أرقام الموظفين - الإدارة العامة للجنسية ووثائق السفر الكويتية
  </footer>

  <script>
    const SUPABASE_URL =
      "https://hxdpfrnxawhyanjwvlmv.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_TLic-BebUrdemyOnDcKnnQ_MnlLJjgH";

    const TABLE_NAME = "employees";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const contactsList = document.getElementById("contactsList");
    const emptyMessage = document.getElementById("emptyMessage");

    let allContacts = [];


    function safe(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value).trim();
    }


    function escapeHtml(value) {
      return safe(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function normalizeColumnName(value) {
      return safe(value)
        .toLowerCase()
        .replaceAll("أ", "ا")
        .replaceAll("إ", "ا")
        .replaceAll("آ", "ا")
        .replaceAll("ى", "ي")
        .replaceAll("ة", "ه")
        .replaceAll(" ", "")
        .replaceAll("_", "");
    }


    /*
      تحديد اسم الموظف.
      يدعم الإسم والاسم وأي عمود يحتوي على كلمة اسم.
    */
    function getName(contact) {
      const exactColumns = [
        "الإسم",
        "الاسم",
        "اسم الموظف",
        "اسم الموظف الكامل",
        "الاسم الكامل",
        "name",
        "full_name",
        "employee_name"
      ];

      for (const column of exactColumns) {
        if (
          Object.prototype.hasOwnProperty.call(contact, column) &&
          safe(contact[column]) !== ""
        ) {
          return safe(contact[column]);
        }
      }

      const nameEntry = Object.entries(contact).find(([key, value]) => {
        const columnName = normalizeColumnName(key);

        return (
          (
            columnName.includes("اسم") ||
            columnName.includes("name")
          ) &&
          safe(value) !== ""
        );
      });

      return nameEntry ? safe(nameEntry[1]) : "";
    }


    function getJobTitle(contact) {
      const jobEntry = Object.entries(contact).find(([key, value]) => {
        const columnName = normalizeColumnName(key);

        return (
          (
            columnName.includes("وظيف") ||
            columnName.includes("مسمى") ||
            columnName.includes("job") ||
            columnName.includes("title")
          ) &&
          safe(value) !== ""
        );
      });

      return jobEntry ? safe(jobEntry[1]) : "";
    }


    function isNameColumn(key) {
      const columnName = normalizeColumnName(key);

      return (
        columnName.includes("اسم") ||
        columnName.includes("name")
      );
    }


    function isJobColumn(key) {
      const columnName = normalizeColumnName(key);

      return (
        columnName.includes("وظيف") ||
        columnName.includes("مسمى") ||
        columnName.includes("job") ||
        columnName.includes("title")
      );
    }


    function isPhoneColumn(key) {
      const columnName = normalizeColumnName(key);

      return (
        columnName.includes("رقم") ||
        columnName.includes("هاتف") ||
        columnName.includes("داخلي") ||
        columnName.includes("مباشر") ||
        columnName.includes("phone") ||
        columnName.includes("tel") ||
        columnName.includes("mobile")
      );
    }


    function isIdColumn(key) {
      return normalizeColumnName(key) === "id";
    }


    function normalizePhone(value) {
      return safe(value).replace(/[^\d+]/g, "");
    }


    function createDataRows(contact) {
      const rows = [];

      Object.entries(contact).forEach(([key, value]) => {
        if (!safe(value)) {
          return;
        }

        if (
          isNameColumn(key) ||
          isJobColumn(key) ||
          isIdColumn(key)
        ) {
          return;
        }

        const label = escapeHtml(key);
        const text = escapeHtml(value);

        if (isPhoneColumn(key)) {
          const phone = normalizePhone(value);

          rows.push(`
            <div class="data-row">
              <span class="data-label">${label}</span>

              <span class="data-value phone-value">
                <a href="tel:${escapeHtml(phone)}">${text}</a>
              </span>
            </div>
          `);
        } else {
          rows.push(`
            <div class="data-row">
              <span class="data-label">${label}</span>
              <span class="data-value">${text}</span>
            </div>
          `);
        }
      });

      return rows.join("");
    }


    function showMessage(message, className = "") {
      contactsList.innerHTML = "";
      emptyMessage.className = `empty ${className}`;
      emptyMessage.innerHTML = message;
      emptyMessage.style.display = "flex";
    }


    function displayContacts(contacts) {
      contactsList.innerHTML = "";

      /*
        حذف أي سجل ليس لديه اسم.
        لن تظهر بطاقة "بدون اسم" نهائيًا.
      */
      const contactsWithNames = contacts.filter(contact => {
        return getName(contact) !== "";
      });

      if (contactsWithNames.length === 0) {
        showMessage("لا توجد نتائج مطابقة");
        return;
      }

      emptyMessage.style.display = "none";

      contactsWithNames.forEach(contact => {
        const name = getName(contact);
        const jobTitle = getJobTitle(contact);

        const card = document.createElement("article");
        card.className = "contact-card";

        card.innerHTML = `
          <div class="contact-name">
            ${escapeHtml(name)}
          </div>

          ${
            jobTitle
              ? `
                <div class="job-title">
                  ${escapeHtml(jobTitle)}
                </div>
              `
              : ""
          }

          ${createDataRows(contact)}
        `;

        contactsList.appendChild(card);
      });
    }


    async function loadContacts() {
      /*
        تحميل البيانات فقط، بدون عرضها عند فتح الصفحة.
      */
      showMessage("اكتب اسم الموظف ثم اضغط بحث");

      try {
        const {
          data,
          error
        } = await supabaseClient
          .from(TABLE_NAME)
          .select("*");

        if (error) {
          throw error;
        }

        allContacts = Array.isArray(data) ? data : [];

        console.log("تم تحميل البيانات من Supabase:", allContacts);

      } catch (error) {
        console.error("Supabase error:", error);

        showMessage(
          "تعذر تحميل البيانات من Supabase.<br>" +
          "تأكد من صلاحية قراءة جدول employees.",
          "error"
        );
      }
    }


    function searchContacts() {
      const searchText =
        searchInput.value.trim().toLowerCase();

      if (!searchText) {
        showMessage("اكتب اسم الموظف ثم اضغط بحث");
        return;
      }

      const filteredContacts = allContacts.filter(contact => {
        const name = getName(contact).toLowerCase();

        return name.includes(searchText);
      });

      displayContacts(filteredContacts);
    }


    searchButton.addEventListener("click", searchContacts);

    searchInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchContacts();
      }
    });


    /*
      لا يوجد input event هنا.
      البحث لا يعمل أثناء الكتابة، فقط عند الضغط على بحث أو Enter.
    */
    loadContacts();
  </script>

</body>

</html>
